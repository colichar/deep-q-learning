[project]
name = "deep-q-learning"
version = "0.1.0"
description = "Deep Q-Learning agent for Atari Space Invaders (PyTorch)"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pillow",
    "gymnasium",
    "ale-py",
    "autorom[accept-rom-license]",
    "matplotlib>=3.11.1",
    "pygame>=2.6.0",
    "huggingface_hub>=0.30.0",
]

# torch/torchvision are picked per-machine via an extra, since CPU-only machines and
# machines with an NVIDIA GPU need different wheel builds:
#   CPU-only: uv sync --extra cpu
#   NVIDIA GPU: uv sync --extra cuda
# See README.md.
[project.optional-dependencies]
cpu = ["torch", "torchvision"]
cuda = ["torch", "torchvision"]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# CUDA 12.6 wheels - broadly compatible with recent NVIDIA GPUs/drivers.
# Bump the tag here (e.g. cu130) if a newer CUDA toolkit is ever needed.
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "tensorboard>=2.21.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: exercises multiple components together (env, model, filesystem); slower than unit tests",
]
